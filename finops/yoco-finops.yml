meters:
- name: transaction_processing_fee
  description: Percentage fee (2.95% excl VAT, local online) applied to each successful card transaction value.
  unit: percent_of_transaction_value
  aggregation: sum
  dimensions:
  - merchant
  - channel
  - currency
- name: transaction_count
  description: Count of successful payments processed; informational, since the fee is value-based.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - channel
- name: refunded_value
  description: Value refunded to customers; reduces net processed value.
  unit: currency
  aggregation: sum
  dimensions:
  - merchant
principles:
- name: Visibility
  description: Track processed transaction value and effective blended rate per channel (online vs in-person) using the /v1/payments read API and webhooks.
- name: Allocation
  description: Tag checkouts and payments with metadata (order/team/store) so processing fees map to internal cost centers.
- name: Optimization
  description: Consolidate online and card-machine volume to qualify for lower blended rates; pursue the automatic volume discount and custom rates above R200k/month.
- name: Accountability
  description: Reconcile Yoco settlement against processed value monthly; monitor for the automatic rate reductions Yoco applies after ~3 months.
