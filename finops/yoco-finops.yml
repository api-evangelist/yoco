description: >-
  FinOps view of Yoco spend. Yoco does not charge for API access; cost is a
  per-transaction processing fee on successful card payments. For the online
  gateway the advertised rate is 2.95% (excl VAT) per local transaction with no
  monthly or setup fee, trending lower with volume. Because the fee is a
  percentage of transaction value, spend scales directly with payment volume
  rather than with API call counts - the primary cost meter is processed
  transaction value, not requests. Rates are modeled from public pricing and
  not reconciled here.
notes: >-
  Per-unit rates and VAT treatment are not reconciled; verify on the Yoco
  pricing page. The dominant, and effectively only, Yoco line item for an API
  integration is the transaction processing fee - the developer platform,
  webhooks, and test mode carry no separate charge.
