aid: yoco
url: https://raw.githubusercontent.com/api-evangelist/yoco/refs/heads/main/apis.yml
name: Yoco
kind: company
description: Yoco is a South African fintech providing card acceptance and payments
  infrastructure for small and medium businesses - card machines, point of sale, and
  online payments. Its developer platform exposes REST APIs for accepting online
  card payments - the Checkout API (server-side hosted checkout at
  payments.yoco.com/api) for creating payment sessions and issuing refunds, plus a
  newer versioned Yoco API (api.yoco.com/v1) for reading payments, refunds, and
  payment links. Integrations authenticate with a secret key (Bearer) and receive
  asynchronous notifications via signed webhooks. Yoco operates primarily in South
  Africa and settles in ZAR.
